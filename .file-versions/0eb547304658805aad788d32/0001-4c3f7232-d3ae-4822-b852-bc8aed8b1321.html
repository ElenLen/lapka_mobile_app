<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Лапа — соцсеть для питомцев</title>
<style>
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

:root {
  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --ink: #1A1C1A;
  --ink-2: #5C625E;
  --line: #E7E6E1;
  --accent: #0F6B4F;
  --accent-ink: #0B5540;
  --accent-soft: #E4F0E9;
  --danger: #B3402F;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 6px 24px rgba(20,22,26,.06);
  --tabbar-h: 56px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 32px;
  background:
    radial-gradient(circle at 50% 16%, rgba(255,255,255,.92), transparent 34%),
    #e9ebee;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  color: #17181a;
}

.phone-frame {
  position: relative;
  width: calc(393px + 12px * 2);
  height: calc(852px + 12px * 2);
  padding: 12px;
  border-radius: 60px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.18), transparent 17%),
    linear-gradient(160deg, #3a3a3d 0%, #1d1d20 47%, #09090b 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.13),
    inset 0 0 0 2px rgba(0,0,0,.9),
    0 34px 70px -20px rgba(0,0,0,.55),
    0 12px 28px -12px rgba(0,0,0,.36);
  isolation: isolate;
}
.phone-frame::before,
.phone-frame::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 102px;
  bottom: 102px;
  width: 3px;
  border-radius: 3px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 12%, transparent 22%, transparent 78%, rgba(255,255,255,.08) 90%, transparent);
}
.phone-frame::before { left: -1px; }
.phone-frame::after { right: -1px; }

.hardware-button {
  position: absolute;
  width: 4px;
  border-radius: 3px;
  background: linear-gradient(90deg, #050506, #242428 58%, #08080a);
  box-shadow: inset 0 1px rgba(255,255,255,.08);
}
.hardware-button.silent { left: -3px; top: 175px; height: 34px; }
.hardware-button.volume-up { left: -3px; top: 225px; height: 62px; }
.hardware-button.volume-down { left: -3px; top: 299px; height: 62px; }
.hardware-button.power { right: -3px; top: 252px; height: 104px; }

.phone-screen {
  position: relative;
  width: 393px;
  height: 852px;
  overflow: hidden;
  border-radius: 48px;
  background: #f7f7f8;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
}

.phone-content {
  position: absolute;
  inset: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-top: 59px;
  padding-bottom: 34px;
  background: #f7f7f8;
}
.phone-content::-webkit-scrollbar { display: none; }

.dynamic-island {
  position: absolute;
  z-index: 20;
  top: 11px;
  left: 50%;
  width: 126px;
  height: 37px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: #000;
  box-shadow: inset 0 -1px 1px rgba(255,255,255,.05);
  pointer-events: none;
}
.status-bar {
  position: absolute;
  z-index: 15;
  top: 0;
  left: 0;
  right: 0;
  height: 59px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 27px 0;
  color: #111214;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -.01em;
  pointer-events: none;
}
.status-icons { display: inline-flex; align-items: center; gap: 6px; }
.status-icons svg { display: block; width: 17px; height: 11px; fill: currentColor; }
.status-icons .battery { width: 25px; }
.home-indicator {
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 8px;
  width: 134px;
  height: 5px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: #111214;
  opacity: .9;
  pointer-events: none;
}

@media (max-height: 939px) { .phone-frame { zoom: 0.9; } }
@media (max-height: 851px) { .phone-frame { zoom: 0.82; } }
@media (max-height: 781px) { .phone-frame { zoom: 0.74; } }
@media (max-height: 711px) { .phone-frame { zoom: 0.66; } }
@media (max-width: 480px) {
  body { padding: 0; display: block; }
  .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
  .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
  .phone-screen { width: 100%; height: 100%; border-radius: 0; }
}

.app {
  height: 100%;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
}
.app-main { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.app-main::-webkit-scrollbar { display: none; }

.screen { min-height: 100%; padding: 16px 16px 24px; }
.screen[hidden] { display: none; }

h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.icon { width: 22px; height: 22px; flex: none; }
.icon-sm { width: 18px; height: 18px; }

.brand { display: flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.brand .paw-badge {
  width: 34px; height: 34px; border-radius: 12px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
}
.brand .paw-badge svg { width: 20px; height: 20px; }

.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 14px; margin-top: 14px;
}
.search input { border: 0; background: none; flex: 1; min-width: 0; font-size: 15px; }
.search input:focus { outline: none; }
.search .icon { color: var(--ink-2); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.section-title { font-size: 17px; font-weight: 700; margin: 22px 0 10px; }
.section-title:first-child { margin-top: 0; }

.stories { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none; }
.story { flex: none; width: 68px; display: grid; gap: 6px; justify-items: center; }
.story .ring {
  width: 62px; height: 62px; border-radius: 50%; padding: 3px;
  background: var(--accent-soft);
}
.story .ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--surface); }
.story span { font-size: 12px; color: var(--ink-2); max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.post { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 14px; overflow: hidden; }
.post-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.post-head img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.post-head .who { flex: 1; min-width: 0; }
.post-head .who b { display: block; font-size: 15px; }
.post-head .who time { font-size: 13px; color: var(--ink-2); }
.post-text { padding: 0 14px 10px; font-size: 15px; }
.post-img { display: block; width: 100%; height: auto; }
.post-actions { display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
.act {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 10px; border-radius: 999px;
  color: var(--ink-2); font-size: 14px; font-weight: 600;
}
.act:hover { background: var(--bg); }
.act.liked { color: var(--danger); }
.act.liked svg { fill: var(--danger); }
.post-likes { padding: 0 14px 6px; font-size: 14px; font-weight: 600; }
.post-comments { padding: 0 14px 12px; display: grid; gap: 6px; }
.post-comments p { font-size: 14px; }
.post-comments b { font-weight: 700; }
.comment-form { display: flex; gap: 8px; padding: 0 14px 14px; }
.comment-form input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 14px; font-size: 14px; background: var(--bg);
}
.comment-form button {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: #fff; display: grid; place-items: center;
}

.pet-switch { display: flex; gap: 10px; margin-top: 14px; }
.pet-chip {
  flex: 1; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; text-align: left;
}
.pet-chip img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.pet-chip b { display: block; font-size: 15px; }
.pet-chip small { color: var(--ink-2); font-size: 13px; }
.pet-chip.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }

.tabs { display: flex; gap: 8px; margin-top: 14px; }
.tab {
  flex: 1; min-height: 44px; border-radius: 999px; padding: 8px 4px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 14px; font-weight: 600; color: var(--ink-2);
}
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.diary-body { margin-top: 14px; display: grid; gap: 12px; }

.stat-card { padding: 16px; }
.stat-card .label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.stat-card .value { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
.stat-card .value small { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.stat-card svg { display: block; margin-top: 8px; }

.vet-card { padding: 16px; display: flex; gap: 14px; }
.date-badge {
  flex: none; width: 52px; height: 58px; border-radius: var(--radius-sm);
  background: var(--accent-soft); color: var(--accent-ink);
  display: grid; place-content: center; text-align: center; gap: 0;
}
.date-badge b { font-size: 22px; line-height: 1.1; }
.date-badge span { font-size: 12px; font-weight: 700; text-transform: uppercase; }
.vet-card .info { flex: 1; min-width: 0; }
.vet-card .info b { display: block; font-size: 16px; }
.vet-card .info p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.vet-card .go { flex: none; align-self: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px;
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
}
.btn:hover { background: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--accent-ink); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--bg); }
.btn.block { width: 100%; }
.btn.danger { background: var(--danger); }

.meal { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.meal .time { flex: none; width: 52px; font-weight: 700; font-size: 15px; color: var(--accent-ink); }
.meal .what { flex: 1; min-width: 0; }
.meal .what b { display: block; font-size: 15px; }
.meal .what small { color: var(--ink-2); font-size: 13px; }
.meal .kcal { flex: none; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.list { display: grid; gap: 8px; }

.cal { padding: 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head b { font-size: 16px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-grid .dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 4px 0; }
.day {
  position: relative; aspect-ratio: 1; border-radius: 10px;
  display: grid; place-items: center; font-size: 14px; font-weight: 600;
  color: var(--ink); min-height: 40px;
}
.day.blank { background: none; }
.day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.day.has-event { background: var(--accent-soft); color: var(--accent-ink); }
.day.selected { background: var(--accent); color: #fff; }
.day .dot { position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.day.selected .dot { background: #fff; }

.habit { display: flex; gap: 12px; padding: 14px; align-items: flex-start; }
.habit .h-icon {
  flex: none; width: 40px; height: 40px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent-ink);
  display: grid; place-items: center;
}
.habit p { font-size: 15px; }

.map-wrap { position: relative; margin-top: 14px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
.map-wrap svg.map { display: block; width: 100%; height: auto; }
.map-pin {
  position: absolute; transform: translate(-50%, -100%);
  display: grid; justify-items: center; gap: 2px;
}
.map-pin .bubble {
  width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
  border: 3px solid var(--surface); box-shadow: 0 4px 12px rgba(0,0,0,.25);
  background: var(--accent-soft);
}
.map-pin .bubble img { width: 100%; height: 100%; object-fit: cover; }
.map-pin .bubble span { display: grid; place-items: center; width: 100%; height: 100%; font-weight: 800; color: var(--accent-ink); font-size: 16px; }
.map-pin.me .bubble { border-color: var(--accent); }
.map-pin .tag {
  background: var(--ink); color: #fff; font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.fab {
  position: absolute; right: 14px; bottom: 14px;
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 999px;
  background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,.18); border: 1px solid var(--line);
}
.fab.on { background: var(--accent); color: #fff; border-color: var(--accent); }

.near-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 10px; }
.near-card img, .near-card .avatar-fallback {
  width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;
  display: grid; place-items: center; font-weight: 800; color: var(--accent-ink);
  background: var(--accent-soft); font-size: 17px;
}
.near-card .who { flex: 1; min-width: 0; }
.near-card .who b { display: block; font-size: 15px; }
.near-card .who small { display: block; color: var(--ink-2); font-size: 13px; }
.near-card .dist { flex: none; font-size: 13px; font-weight: 700; color: var(--accent-ink); }
.near-card .btn { min-height: 40px; padding: 0 14px; font-size: 14px; }

.group-card { display: flex; gap: 12px; padding: 12px 14px; margin-top: 10px; align-items: center; }
.group-card img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; flex: none; }
.group-card .who { flex: 1; min-width: 0; }
.group-card .who b { display: block; font-size: 15px; }
.group-card .who small { color: var(--ink-2); font-size: 13px; }
.group-card .btn { min-height: 40px; padding: 0 14px; font-size: 14px; }

.profile-cover { position: relative; margin: -16px -16px 0; height: 180px; }
.profile-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-head { display: flex; align-items: flex-end; gap: 14px; margin-top: -34px; padding: 0 4px; }
.profile-head .avatar {
  width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
  border: 4px solid var(--bg); flex: none; background: var(--surface);
}
.profile-head .names { flex: 1; min-width: 0; padding-bottom: 4px; }
.profile-head .names b { font-size: 22px; letter-spacing: -.02em; }
.profile-head .names p { color: var(--ink-2); font-size: 14px; }
.profile-bio { padding: 12px 4px 0; font-size: 15px; color: var(--ink); }
.profile-stats { display: flex; margin: 14px 4px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.profile-stats > div { flex: 1; text-align: center; padding: 12px 4px; }
.profile-stats b { display: block; font-size: 18px; }
.profile-stats span { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.profile-actions { display: flex; gap: 10px; margin-top: 14px; }
.profile-actions .btn { flex: 1; }

.album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.album button { padding: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: var(--line); }
.album img { width: 100%; height: 100%; object-fit: cover; display: block; }

.subs { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-top: 10px; }
.subs .stack { display: flex; }
.subs .stack span, .subs .stack img {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--surface);
  margin-left: -10px; object-fit: cover; background: var(--accent-soft);
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--accent-ink);
}
.subs .stack > :first-child { margin-left: 0; }
.subs p { font-size: 14px; color: var(--ink-2); flex: 1; min-width: 0; }

.mini-pet { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-top: 10px; }
.mini-pet img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none; }
.mini-pet .who { flex: 1; min-width: 0; }
.mini-pet .who b { display: block; font-size: 15px; }
.mini-pet .who small { color: var(--ink-2); font-size: 13px; }

.tabbar {
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + 2px);
}
.tabbar button {
  flex: 1; display: grid; justify-items: center; gap: 3px;
  min-height: 48px; color: var(--ink-2); border-radius: 12px;
  font-size: 11px; font-weight: 600;
}
.tabbar button.active { color: var(--accent); }
.tabbar button span { line-height: 1; }

.overlay {
  position: absolute; z-index: 50;
  top: 59px; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
}
.overlay[hidden] { display: none; }
.overlay-head {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  min-height: 56px;
}
.overlay-head .back {

function weightSpark(values) {
  const w = 200, h = 48, pad = 4;
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i * (w - pad * 2)) / (values.length - 1);
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Динамика веса">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function renderCalendar(pet) {
  const grid = $('#calGrid');
  if (!grid) return;
  const dows = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  let html = dows.map((d) => `<div class="dow">${d}</div>`).join('');
  const startOffset = 3;
  for (let i = 0; i < startOffset; i++) html += '<div class="day blank"></div>';
  for (let day = 1; day <= 31; day++) {
    const evs = pet.events.filter((e) => e.day === day);
    const cls = ['day'];
    if (day === 9) cls.push('today');
    if (evs.length) cls.push('has-event');
    html += `<button class="${cls.join(' ')}" data-day="${day}" aria-label="${day} октября${evs.length ? ', есть события' : ''}">${day}${evs.length ? '<span class="dot"></span>' : ''}</button>`;
  }
  grid.innerHTML = html;
}

function switchTab(tab) {
  state.tab = tab;
  $$('#tabbar button').forEach((b) => {
    const active = b.dataset.tab === tab;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active);
  });
  ['feed', 'diary', 'map', 'groups', 'profile'].forEach((t) => {
    $('#screen-' + t).hidden = t !== tab;
  });
  if (tab === 'diary') { renderPetSwitch(); renderDiaryTabs(); renderDiary(); }
  if (tab === 'map') renderMap();
  if (tab === 'groups') renderGroups();
  if (tab === 'profile') renderProfile();
  if (tab === 'feed') renderFeed();
  $('#appMain').scrollTop = 0;
}

function openChat(nearId) {
  const n = NEARBY.find((x) => x.id === nearId);
  if (!n) return;
  const messages = nearId === 'n1' ? CHAT.messages : [
    { from: 'them', text: `Привет! Это ${n.owner}. ${n.pet} ищет компанию для прогулки.`, time: '17:10' }
  ];
  openOverlay(`${n.owner} и ${n.pet}`, 'в сети', `
    <div class="chat-messages">
      ${messages.map((m) => `<div class="msg ${m.from}">${esc(m.text)}<time>${esc(m.time)}</time></div>`).join('')}
    </div>
    <form class="chat-form" data-chat-form>
      <input type="text" placeholder="Сообщение…" aria-label="Сообщение" required maxlength="300" autocomplete="off">
      <button type="submit" aria-label="Отправить">${ICONS.send}</button>
    </form>`);
  const form = $('body').querySelector('[data-chat-form]');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const input = form.querySelector('input');
    const text = input.value.trim();
    if (!text) return;
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    const box = form.previousElementSibling;
    box.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}<time>${time}</time></div>`);
    input.value = '';
    box.scrollTop = box.scrollHeight;
    setTimeout(() => {
      box.insertAdjacentHTML('beforeend', `<div class="msg them">Договорились! До встречи на прогулке.<time>${time}</time></div>`);
      box.scrollTop = box.scrollHeight;
    }, 1400);
  });
}

  openOverlay(p.name, `${p.breed} · ${p.age}`, `
    <div class="profile-cover" style="margin:-16px -16px 0;"><img src="${p.cover}" width="960" height="643" alt="${esc(p.name)}"></div>
    <div class="profile-head">
      <img class="avatar" src="${p.avatar}" width="960" height="643" alt="${esc(p.name)}">
      <div class="names"><b>${esc(p.name)}</b><p>${esc(p.species)} · ${esc(p.age)}</p></div>
    </div>
    <p class="profile-bio">${esc(p.bio)}</p>
    <div class="profile-stats">
      <div><b>${p.posts}</b><span>публикации</span></div>
      <div><b>${p.subscribers}</b><span>подписчики</span></div>
      <div><b>${p.following}</b><span>подписки</span></div>
    </div>
    <div class="profile-actions">
      <button class="btn ${sub ? 'ghost' : ''}" data-subscribe="${p.id}" aria-pressed="${sub}">${sub ? 'Вы подписаны' : 'Подписаться'}</button>
      <button class="btn ghost" data-chat-pet="${p.id}">Написать</button>
    </div>
    <h2 class="section-title">Фото</h2>
    <div class="album">
      ${p.album.map((a, i) => `<button data-photo="other:${p.id}:${i}" aria-label="Открыть фото">${avatarHtml({ avatar: a.src, name: p.name })}</button>`).join('')}
    </div>`);
}

function openPhoto(src, caption) {
  $('#viewerImg').src = src;
  $('#viewerImg').alt = caption;
  $('#viewerCap').textContent = caption;
  $('#viewer').hidden = false;
  $('#viewerClose').focus();
}

function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  $('#sheet').hidden = false;
  const first = $('#sheetBody').querySelector('input, textarea, select, button');
  if (first) first.focus();
}

function closeSheet() {
  $('#sheet').hidden = true;
  $('#sheetBody').innerHTML = '';
}

function field(label, name, type, value, opts = '') {
  return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value || '')}" ${opts}></div>`;
}

function openMealForm() {
  openSheet(`
    <h3>Приём пищи</h3>
    <form data-form="meal">
      ${field('Время', 'time', 'time', '12:00', 'required')}
      ${field('Что дали', 'food', 'text', '', 'required maxlength="80" placeholder="Например: корм с говядиной"')}
      ${field('Граммы', 'grams', 'number', '', 'required min="1" max="2000" placeholder="150"')}
      <button class="btn block" type="submit">Сохранить</button>
    </form>`);
}

function openHabitForm() {
  openSheet(`
    <h3>Заметка о привычке</h3>
    <form data-form="habit">
      <div class="field"><label for="f-text">Текст</label><textarea id="f-text" name="text" required maxlength="140" placeholder="Например: боится пылесоса"></textarea></div>
      <button class="btn block" type="submit">Сохранить</button>
    </form>`);
}

function openEventForm() {
  openSheet(`
    <h3>Событие в календаре</h3>
    <form data-form="event">
      ${field('Дата', 'day', 'number', '', 'required min="1" max="31" placeholder="15"')}
      ${field('Название', 'title', 'text', '', 'required maxlength="60" placeholder="Ветеринар"')}
      ${field('Место', 'place', 'text', '', 'maxlength="80" placeholder="Клиника"')}
      ${field('Время', 'time', 'time', '10:00')}
      <div class="field"><label for="f-note">Заметка</label><textarea id="f-note" name="note" maxlength="140" placeholder="Детали визита"></textarea></div>
      <button class="btn block" type="submit">Сохранить</button>
    </form>`);
}

function openGroupForm() {
  openSheet(`
    <h3>Новая группа</h3>
    <form data-form="group">
      ${field('Название', 'name', 'text', '', 'required maxlength="60" placeholder="Например: Хвостатые бегуны"')}
      <div class="field"><label for="f-desc">Описание</label><textarea id="f-desc" name="desc" required maxlength="200" placeholder="О чём эта группа?"></textarea></div>
      <button class="btn block" type="submit">Создать</button>
    </form>`);
}

function openDaySheet(day) {
  const pet = PETS[state.pet];
  const evs = pet.events.filter((e) => e.day === day);
  openSheet(`
    <h3>${day} октября</h3>
    ${evs.length ? `<div class="list">${evs.map((e) => `
      <div class="card habit">
        <span class="h-icon">${ICONS.calendar}</span>
        <p><b>${esc(e.title)}</b><br><span style="color:var(--ink-2);font-size:14px;">${esc(e.place)}${e.time ? ' · ' + esc(e.time) : ''}</span><br><span style="color:var(--ink-2);font-size:14px;">${esc(e.note)}</span></p>
      </div>`).join('')}</div>` : '<div class="empty"><b>Событий нет</b>Добавьте визит к ветеринару или другую запись</div>'}
    <button class="btn block" data-add-event style="margin-top:12px;">${ICONS.plus} Добавить событие</button>`);
}

function bindEvents() {
  $('#tabbar').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tab]');
    if (btn) switchTab(btn.dataset.tab);
  });

  $('#feedSearch').addEventListener('input', (e) => {
    state.feedQuery = e.target.value;
    renderFeed();
  });

  $('#stories').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-pet]');
    if (btn) openPetProfile(btn.dataset.pet);
  });

  $('#feedPosts').addEventListener('click', (e) => {
    const like = e.target.closest('[data-like]');
    if (like) {
      const p = POSTS.find((x) => x.id === Number(like.dataset.like));
      p.liked = !p.liked;
      p.likes += p.liked ? 1 : -1;
      renderFeed();
      return;
    }
    const com = e.target.closest('[data-comments]');
    if (com) {
      const id = Number(com.dataset.comments);
      state.openComments[id] = !state.openComments[id];
      renderFeed();
    }
  });

  $('#feedPosts').addEventListener('submit', (e) => {
    const form = e.target.closest('[data-comment-form]');
    if (!form) return;
    e.preventDefault();
    const input = form.querySelector('input');
    const text = input.value.trim();
    if (!text) return;
    const p = POSTS.find((x) => x.id === Number(form.dataset.commentForm));
    p.comments.push({ who: 'Вы', text });
    state.openComments[p.id] = true;
    renderFeed();
  });

  $('#petSwitch').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-pet-btn]');
    if (btn) {
      state.pet = btn.dataset.petBtn;
      renderPetSwitch();
      renderDiary();
    }
  });

  $('#diaryTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-diary-tab]');
    if (btn) {
      state.diaryTab = btn.dataset.diaryTab;
      renderDiaryTabs();
      renderDiary();
    }
  });

  $('#diaryContent').addEventListener('click', (e) => {
    if (e.target.closest('[data-goto-calendar]')) {
      state.diaryTab = 'calendar';
      renderDiaryTabs();
      renderDiary();
    }
    if (e.target.closest('[data-add-meal]')) openMealForm();
    if (e.target.closest('[data-add-habit]')) openHabitForm();
    if (e.target.closest('[data-add-event]')) openEventForm();
  });

  $('#diaryContent').addEventListener('click', (e) => {
    const dayBtn = e.target.closest('[data-day]');
    if (dayBtn) openDaySheet(Number(dayBtn.dataset.day));
  });

  $('#nearbyToggle').addEventListener('click', () => {
    state.meNearby = !state.meNearby;
    const btn = $('#nearbyToggle');
    btn.classList.toggle('on', state.meNearby);
    btn.setAttribute('aria-pressed', state.meNearby);
    $('#nearbyToggleLabel').textContent = state.meNearby ? 'Вы рядом' : 'Я рядом';
    renderMap();
    toast(state.meNearby ? 'Ваша метка видна рядом' : 'Метка скрыта');
  });

  $('#mapPins').addEventListener('click', (e) => {
    const pin = e.target.closest('[data-near]');
    if (pin) {
      const n = NEARBY.find((x) => x.id === pin.dataset.near);
      if (n && state.meNearby) openChat(n.id);
      else if (n) toast('Включите «Я рядом», чтобы писать');
    }
  });

  $('#nearbyList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-chat]');
    if (btn && !btn.disabled) openChat(btn.dataset.chat);
  });

  $('#myGroups').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-group]');
    if (btn) openGroup(btn.dataset.group);
  });

  $('#discoverGroups').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-group]');
    if (btn) {
      const g = GROUPS.find((x) => x.id === btn.dataset.group);
      g.joined = true;
      g.members += 1;
      renderGroups();
      toast(`Вы вступили в «${g.name}»`);
    }
  });

  $('#createGroupBtn').addEventListener('click', openGroupForm);

  $('#overlayBody').addEventListener('click', (e) => {
    const gt = e.target.closest('[data-group-toggle]');
    if (gt) {
      const g = GROUPS.find((x) => x.id === gt.dataset.groupToggle);
      g.joined = !g.joined;
      g.members += g.joined ? 1 : -1;
      closeOverlay();
      renderGroups();
      toast(g.joined ? `Вы вступили в «${g.name}»` : `Вы покинули «${g.name}»`);
      return;
    }
    const sub = e.target.closest('[data-subscribe]');
    if (sub) {
      const id = sub.dataset.subscribe;
      state.subscribed[id] = !state.subscribed[id];
      openPetProfile(id);
      return;
    }
    const chatPet = e.target.closest('[data-chat-pet]');
    if (chatPet) {
      const p = OTHERS[chatPet.dataset.chatPet];
      closeOverlay();
      openChat(p.id === 'barsik' ? 'n1' : 'n2');
    }
  });

  $('#profileContent').addEventListener('click', (e) => {
    const photo = e.target.closest('[data-photo]');
    if (photo) {
      const [pid, idx] = photo.dataset.photo.split(':');
      const pet = PETS[pid];
      const a = pet.album[Number(idx)];
      openPhoto(a.src, a.caption);
    }
    const mini = e.target.closest('[data-pet]');
    if (mini) openPetProfile(mini.dataset.pet);
  });

  $('#overlayBody').addEventListener('click', (e) => {
    const photo = e.target.closest('[data-photo]');
    if (photo) {
      const [, pid, idx] = photo.dataset.photo.split(':');
      const p = OTHERS[pid];
      const a = p.album[Number(idx)];
      openPhoto(a.src, a.caption);
    }
  });

  $('#overlayBack').addEventListener('click', closeOverlay);
  $('#viewerClose').addEventListener('click', () => { $('#viewer').hidden = true; });

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-add-event]') && !e.target.closest('#diaryContent')) {
      if (!$('#sheet').hidden) openEventForm();
    }
  });

  $('#sheetBody').addEventListener('click', (e) => {
    if (e.target.closest('[data-add-event]')) openEventForm();
  });

  $('#sheetBody').addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target.closest('[data-form]');
    if (!form) return;
    const type = form.dataset.form;
    const data = Object.fromEntries(new FormData(form).entries());
    const pet = PETS[state.pet];
    if (type === 'meal') {
      const grams = Number(data.grams);
      if (!data.time || !data.food || !grams) return;
      pet.meals.push({ time: data.time, food: data.food, grams, kcal: Math.round(grams * 2.8) });
      pet.meals.sort((a, b) => a.time.localeCompare(b.time));
      closeSheet();
      renderDiary();
      toast('Приём пищи добавлен');
    } else if (type === 'habit') {
      if (!data.text) return;
      pet.habits.push({ icon: 'star', text: data.text });
      closeSheet();
      renderDiary();
      toast('Заметка добавлена');
    } else if (type === 'event') {
      const day = Number(data.day);
      if (!day || day < 1 || day > 31 || !data.title) return;
      pet.events.push({ day, title: data.title, place: data.place || 'Не указано', time: data.time || '', note: data.note || '' });
      closeSheet();
      state.diaryTab = 'calendar';
      renderDiaryTabs();
      renderDiary();
      toast('Событие добавлено в календарь');
    } else if (type === 'group') {
      if (!data.name || !data.desc) return;
      GROUPS.unshift({ id: 'g' + Date.now(), name: data.name, members: 1, joined: true, img: PETS[state.pet].album[0].src, desc: data.desc });
      closeSheet();
      renderGroups();
      toast('Группа создана');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('#viewer').hidden) $('#viewer').hidden = true;
      else if (!$('#sheet').hidden) closeSheet();
      else if (!$('#overlay').hidden) closeOverlay();
    }
  });
}

renderStories();
renderFeed();
renderPetSwitch();
renderDiaryTabs();
renderDiary();
renderMap();
renderGroups();
renderProfile();
bindEvents();
</script>
</body>
</html>
